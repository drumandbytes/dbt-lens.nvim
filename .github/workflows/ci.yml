name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [v0.11.7, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - run: make test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: astral-sh/setup-uv@v5
      - run: make test-integration

  # The one name the org ruleset requires, however the jobs above change.
  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [stylua, luacheck, test, integration, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
